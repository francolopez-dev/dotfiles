# Startup and SketchyBar integration.
start-at-login = true

after-login-command = []
after-startup-command = []
# Notify SketchyBar when the focused AeroSpace workspace changes.
exec-on-workspace-change = ['/bin/bash', '-c',
    'sketchybar --trigger aerospace_workspace_change FOCUSED_WORKSPACE=$AEROSPACE_FOCUSED_WORKSPACE'
]

# Layout defaults.
enable-normalization-flatten-containers = true
enable-normalization-opposite-orientation-for-nested-containers = true

accordion-padding = 30
default-root-container-layout = 'tiles'
default-root-container-orientation = 'auto'
automatically-unhide-macos-hidden-apps = false

# Keep the pointer on the active display when focus changes across monitors.
on-focused-monitor-changed = ['move-mouse monitor-lazy-center']

[key-mapping]
preset = 'qwerty'

# Gaps apply to tiled layouts. Keep the top gap equal to SketchyBar's height
# so windows start below the bar before they are converted to floating.
[gaps]
inner.horizontal = 5
inner.vertical = 5
outer.left = 5
outer.right = 5
# The native menu bar is auto-hidden (scripts/macos-defaults.sh) and
# SketchyBar (height 28) is the primary bar on every display.
outer.top = 28
outer.bottom = 5

# Workspace placement. SketchyBar renders these in the explicit order
# one, two, three, four, five, six, seven.
[workspace-to-monitor-force-assignment]
'one' = 'Built-in Retina Display'    # Communication
'two' = 'Built-in Retina Display'    # Personal and work mail
'three' = 'Built-in Retina Display'  # AI tools
'four' = 'Built-in Retina Display'   # Extra built-in workspace
'five' = 'LU28R55'                   # Browser / web
'six' = 'LU28R55'                    # Development / terminal
'seven' = 'LU28R55'                  # Extra external workspace

# Ideas to review later:
# 'x' = 'Built-in Retina Display'    # Extra built-in workspace
# 'y' = 'Built-in Retina Display'    # Extra built-in workspace
# 'z' = 'Built-in Retina Display'    # Extra built-in workspace
# 'tools' = 'LU28R55'                # Docker, GitHub, Transmit
# 'terminal' = 'LU28R55'             # Dedicated fullscreen terminal

# Main keybindings.
[mode.main.binding]
cmd-h = [] # Disable "hide application"
cmd-alt-h = [] # Disable "hide others"

# Window navigation.
ctrl-h = 'focus left'
ctrl-j = 'focus down'
ctrl-k = 'focus up'
ctrl-l = 'focus right'

# Move windows within the current layout tree.
alt-ctrl-h = 'move left'
alt-ctrl-j = 'move down'
alt-ctrl-k = 'move up'
alt-ctrl-l = 'move right'

# Resize the focused node.
ctrl-minus = 'resize smart -50'
ctrl-equal = 'resize smart +50'


# Workspace switching (Ctrl + number).
ctrl-1 = 'workspace one'
ctrl-2 = 'workspace two'
ctrl-3 = 'workspace three'
ctrl-4 = 'workspace four'
ctrl-5 = 'workspace five'
ctrl-6 = 'workspace six'
ctrl-7 = 'workspace seven'

# Move the focused window to a workspace (Ctrl + Shift + number).
ctrl-shift-1 = 'move-node-to-workspace one --focus-follows-window'
ctrl-shift-2 = 'move-node-to-workspace two --focus-follows-window'
ctrl-shift-3 = 'move-node-to-workspace three --focus-follows-window'
ctrl-shift-4 = 'move-node-to-workspace four --focus-follows-window'
ctrl-shift-5 = 'move-node-to-workspace five --focus-follows-window'
ctrl-shift-6 = 'move-node-to-workspace six --focus-follows-window'
ctrl-shift-7 = 'move-node-to-workspace seven --focus-follows-window'

alt-tab = 'workspace-back-and-forth'

# App launchers.
alt-shift-enter = 'exec-and-forget open -n /Applications/Alacritty.app'
alt-enter = 'exec-and-forget open -n /Applications/Ghostty.app'
alt-semicolon = """exec-and-forget open -a "System Settings" """
alt-t = 'exec-and-forget open -n /Applications/Microsoft\ Teams.app'
alt-r = 'exec-and-forget open -a "Reminders"'
alt-f = 'exec-and-forget open -a Finder'
alt-e = 'exec-and-forget open -n /Applications/Microsoft\ Outlook.app'
alt-g = 'exec-and-forget open -n /Applications/ChatGPT.app'

# Browser launchers.
alt-b = 'exec-and-forget open -a Firefox'
alt-shift-b = 'exec-and-forget open -a Safari'

# Ideas to review later:
# alt-g = 'exec-and-forget open -a "Google Chrome"'
# alt-d = 'exec-and-forget open -a "Visual Studio Code"'
# ctrl-shift-m = 'exec-and-forget open -a "Neovide"'
# ctrl-j = 'exec-and-forget open -a Obsidian'
# ctrl-h = 'exec-and-forget open -a Notion'
# ctrl-semicolon = 'exec-and-forget open -a "System Settings"'
# ctrl-t = 'exec-and-forget open -a Transmit'
# ctrl-g = 'exec-and-forget open -a "GitHub Desktop"'
# ctrl-d = 'exec-and-forget open -a "Docker Desktop"'
# ctrl-enter = 'exec-and-forget open -a kitty'
# ctrl-shift-enter = 'exec-and-forget open -a alacritty'

# Layout and monitor controls.
# AeroSpace 0.21 cannot move floating windows directly; the top gap above keeps
# the title bar visible when a tiled window is converted to floating.
cmd-shift-z = 'layout floating tiling'
alt-shift-z = 'flatten-workspace-tree'

# Move the focused window to the next or previous monitor.
ctrl-shift-h = 'move-node-to-monitor --wrap-around next --focus-follows-window'
ctrl-shift-l = 'move-node-to-monitor --wrap-around prev --focus-follows-window'

# Ideas to review later:
# alt-shift-w = 'move-node-to-monitor --wrap-around prev --focus-follows-window'

# Config reload.
ctrl-alt-r = 'reload-config'

