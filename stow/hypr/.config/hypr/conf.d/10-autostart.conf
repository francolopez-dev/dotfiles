# Personal autostart — managed by dotfiles.
# Omarchy's own autostart lives in ~/.local/share/omarchy/default/hypr/autostart.conf
# (do not edit that file — it is overwritten on omarchy update).
#
# Add your personal apps here. Format:
#   exec-once = uwsm-app -- <command>
#
# Check declared vs running:   dotfiles autostart check
# Scan for undeclared apps:    dotfiles autostart scan
# Open this file in editor:    dotfiles autostart edit

# exec-once = uwsm-app -- 1password
# exec-once = uwsm-app -- slack
# exec-once = uwsm-app -- discord
