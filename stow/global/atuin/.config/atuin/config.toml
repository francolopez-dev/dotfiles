# Atuin shell history configuration.
# Managed by dotfiles. Edit here, re-stow to apply.

# Sync mode: use self-hosted server when available, work offline otherwise.
# Set sync_address to your Atuin server if running one.
# sync_address = "https://atuin.example.com"

# Search mode: fuzzy prefix search by default.
search_mode = "fuzzy"

# Filter mode: show only commands from this host by default.
filter_mode = "host"

# Style: compact display.
style = "compact"

# Inline height for search UI.
inline_height = 20

# Show preview of full command.
show_preview = true

# Execute selected commands immediately on Enter.
enter_accept = true

# Key binding mode: use default Ctrl-R binding.
# Supported: emacs, vim-normal, vim-insert, auto
keymap_mode = "auto"

# Store failed commands as well as successful commands.
store_failed = true

# Keep Atuin's built-in token/secret patterns out of history.
secrets_filter = true

# Prefer repo-aware history when working inside Git trees.
workspaces = true

# History filter: exclude commands starting with space.
history_filter = ["^\\s"]

# Show which machine a synced command came from.
[ui]
columns = ["duration", "time", "host", "command"]
