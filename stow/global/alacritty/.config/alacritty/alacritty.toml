# Alacritty - secondary terminal config tracked by dotfiles.
# Shared across every machine. Put only font-size overrides in profiles.

[general]
import = ["~/.config/alacritty/profile-font-size.toml"]

[env]
TERM = "xterm-256color"

[window]
padding = { x = 18, y = 14 }
opacity = 0.92
decorations = "Full"
dynamic_title = true

[font]
normal = { family = "JetBrains Mono", style = "Regular" }
bold = { family = "JetBrains Mono", style = "Bold" }
italic = { family = "JetBrains Mono", style = "Italic" }
bold_italic = { family = "JetBrains Mono", style = "Bold Italic" }
size = 13

[colors.primary]
background = "#1e1e2e"
foreground = "#cdd6f4"

[colors.normal]
black = "#45475a"
red = "#f38ba8"
green = "#a6e3a1"
yellow = "#f9e2af"
blue = "#89b4fa"
magenta = "#f5c2e7"
cyan = "#94e2d5"
white = "#bac2de"

[colors.bright]
black = "#585b70"
red = "#f38ba8"
green = "#a6e3a1"
yellow = "#f9e2af"
blue = "#89b4fa"
magenta = "#f5c2e7"
cyan = "#94e2d5"
white = "#a6adc8"

[cursor]
style = { shape = "Beam", blinking = "Never" }

[selection]
save_to_clipboard = true

[keyboard]
bindings = [
  { key = "C", mods = "Super", action = "Copy" },
  { key = "V", mods = "Super", action = "Paste" },
  { key = "T", mods = "Super", action = "CreateNewTab" },
  { key = "Q", mods = "Super", action = "Quit" },
  { key = "Tab", mods = "Super", action = "SelectNextTab" },
  { key = "Tab", mods = "Super|Shift", action = "SelectPreviousTab" },
]
