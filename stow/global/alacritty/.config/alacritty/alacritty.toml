# Alacritty - secondary terminal config tracked by dotfiles.
# Shared across every machine. Put only font-size overrides in profiles.

[general]
import = ["~/.config/alacritty/profile-font-size.toml"]

[env]
TERM = "xterm-256color"

[window]
padding = { x = 18, y = 14 }
opacity = 0.92
decorations = "Full"
dynamic_title = true

[font]
normal = { family = "JetBrainsMono Nerd Font", style = "Regular" }
bold = { family = "JetBrainsMono Nerd Font", style = "Bold" }
italic = { family = "JetBrainsMono Nerd Font", style = "Italic" }
bold_italic = { family = "JetBrainsMono Nerd Font", style = "Bold Italic" }
offset = { x = 0, y = 0 }
glyph_offset = { x = 0, y = 0 }

[colors.primary]
background = "#0b1024"
foreground = "#dbe7ff"

[colors.cursor]
text = "#0b1024"
cursor = "#77d9ff"

[colors.selection]
text = "#eef5ff"
background = "#253b6e"

[colors.normal]
black = "#172039"
red = "#ff6b9d"
green = "#75f2c8"
yellow = "#ffd47a"
blue = "#79a8ff"
magenta = "#b88cff"
cyan = "#5ee6ff"
white = "#cfdcff"

[colors.bright]
black = "#46527a"
red = "#ff8ab4"
green = "#9dffdf"
yellow = "#ffe49a"
blue = "#9fc0ff"
magenta = "#d1adff"
cyan = "#8af3ff"
white = "#eef5ff"

[cursor]
style = { shape = "Beam", blinking = "Never" }

[selection]
save_to_clipboard = true

[keyboard]
bindings = [
  { key = "C", mods = "Super", action = "Copy" },
  { key = "V", mods = "Super", action = "Paste" },
  { key = "Q", mods = "Super", action = "Quit" },
  { key = "T", mods = "Super", command = { program = "alacritty", args = ["msg", "create-window"] } },
]
