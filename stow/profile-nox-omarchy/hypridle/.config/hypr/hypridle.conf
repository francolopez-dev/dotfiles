# Idle / screensaver / sleep policy for nox (personal T490).
# This is the machine's idle policy and overrides the Omarchy default.
# Personal machine: relaxed timeouts.
#
# Apply with `dotfiles apply`; (re)start with `systemctl --user restart hypridle`
# or it is launched by Omarchy's autostart.

general {
    lock_cmd = omarchy-system-lock
    before_sleep_cmd = OMARCHY_LOCK_ONLY=true omarchy-system-lock
    after_sleep_cmd = sleep 1 && omarchy-system-wake
}

# 4 min: dim the screen (screensaver-style).
listener {
    timeout = 240
    on-timeout = brightnessctl -s set 10
    on-resume = brightnessctl -r
}

# 10 min: lock.
listener {
    timeout = 600
    on-timeout = loginctl lock-session
}

# 11 min: turn the displays off.
listener {
    timeout = 660
    on-timeout = hyprctl dispatch dpms off
    on-resume = omarchy-system-wake
}

# 30 min: suspend.
listener {
    timeout = 1800
    on-timeout = systemctl suspend
}
