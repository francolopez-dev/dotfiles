# Input for nox (personal T490 laptop) — touchpad + gestures.
# Machine-specific because it only makes sense on the laptop's trackpad.

input {
    touchpad {
        natural_scroll = true
        tap-to-click = true
        disable_while_typing = true
        clickfinger_behavior = true
        scroll_factor = 0.4
    }
}

gestures {
    workspace_swipe = true
    workspace_swipe_fingers = 3
}
