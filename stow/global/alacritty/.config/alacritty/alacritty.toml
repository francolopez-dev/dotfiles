# Alacritty - secondary terminal config tracked by dotfiles.
# Shared across every machine. Put only font-size overrides in profiles.

[general]
import = ["~/.config/alacritty/profile-font-size.toml"]

[env]
TERM = "xterm-256color"

[window]
padding = { x = 18, y = 14 }
opacity = 0.92
decorations = "Full"
dynamic_title = true

[font]
normal = { family = "JetBrainsMono Nerd Font", style = "Regular" }
bold = { family = "JetBrainsMono Nerd Font", style = "Bold" }
italic = { family = "JetBrainsMono Nerd Font", style = "Italic" }
bold_italic = { family = "JetBrainsMono Nerd Font", style = "Bold Italic" }
offset = { x = 0, y = 0 }
glyph_offset = { x = 0, y = 0 }

[colors.primary]
background = "#100d1f"
foreground = "#e9ddff"

[colors.cursor]
text = "#100d1f"
cursor = "#d985ff"

[colors.selection]
text = "#f4ecff"
background = "#3a245e"

[colors.normal]
black = "#201830"
red = "#ff5c8a"
green = "#7ef7b6"
yellow = "#ffd166"
blue = "#8aa8ff"
magenta = "#c77dff"
cyan = "#56f0e5"
white = "#d8ccf2"

[colors.bright]
black = "#4b3c64"
red = "#ff7aa8"
green = "#9dffd0"
yellow = "#ffe08a"
blue = "#a7bcff"
magenta = "#d89cff"
cyan = "#7ff7ef"
white = "#f4ecff"

[cursor]
style = { shape = "Beam", blinking = "Never" }

[selection]
save_to_clipboard = true

[keyboard]
bindings = [
  { key = "C", mods = "Super", action = "Copy" },
  { key = "V", mods = "Super", action = "Paste" },
  { key = "Q", mods = "Super", action = "Quit" },
  { key = "T", mods = "Super", command = { program = "alacritty", args = ["msg", "create-window"] } },
]
