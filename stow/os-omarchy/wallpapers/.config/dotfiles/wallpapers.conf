# Dotfiles-managed Omarchy wallpaper rotation.
#
# This file is stowed to:
#   ~/.config/dotfiles/wallpapers.conf
#
# After editing this file in the repo, run:
#   dotfiles apply
#   dotfiles update
#
# Quick commands:
#   dotfiles wallpaper status       # show current settings and counts
#   dotfiles wallpaper rotate       # rotate immediately
#   dotfiles wallpaper open-local   # open the personal wallpaper folder
#
# The rotation script follows Omarchy's audited background behavior: update
# ~/.config/omarchy/current/background and restart swaybg. It verifies swaybg
# started and restores the previous background if startup fails.

# Enable automatic rotation with the systemd user timer.
# Set to 0 to disable on the next `dotfiles update`.
WALLPAPER_ROTATION_ENABLED=1

# Rotation interval. Supported suffixes:
#   s = seconds, m = minutes, h = hours, d = days
# Examples:
#   WALLPAPER_ROTATION_INTERVAL="5m"
#   WALLPAPER_ROTATION_INTERVAL="30m"
#   WALLPAPER_ROTATION_INTERVAL="2h"
WALLPAPER_ROTATION_INTERVAL="15m"

# Repo-managed base wallpapers. Add favorite tracked wallpapers here:
#   stow/os-omarchy/wallpapers/.config/omarchy/backgrounds/walls/
#
# This directory may contain category subfolders. Rotation scans recursively so
# every Git-tracked wallpaper under this tree can be used on every Omarchy host.
WALLPAPER_REPO_DIR="$HOME/.config/omarchy/backgrounds/walls"

# Machine-local personal wallpapers. Add private/personal images here.
# This folder is created automatically and is not inside the Git repo.
# Supported image types: jpg, jpeg, png, webp. Subfolders are scanned too.
WALLPAPER_LOCAL_DIR="$HOME/Pictures/Wallpapers/local"
