# Power policy for nox (personal T490).
# Per-device because battery/thermal trade-offs differ per machine.

# Default to balanced power on login (requires power-profiles-daemon).
exec-once = powerprofilesctl set balanced

misc {
    # Variable refresh rate where the panel supports it.
    vrr = 1
}

# Dim/blur are eased off-battery; see hypridle.conf for screen-off timeouts.
