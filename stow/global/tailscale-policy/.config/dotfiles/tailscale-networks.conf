# Tailscale trusted-network policy.
# Safe committed defaults: disabled and no private identifiers.
# Put real SSIDs, BSSIDs, gateways, DNS suffixes, and marker hosts in:
# ~/.config/dotfiles/tailscale-networks.local

TAILSCALE_NETWORK_POLICY_ENABLED=false

# Exact trusted Wi-Fi SSID matches. Prefer keeping real names in .local.
TRUSTED_SSIDS=()

# Trusted local IPv4 CIDRs. Subnet-only matching is weak because unrelated
# private networks often reuse the same ranges; add a gateway, DNS suffix, or
# marker host below when possible.
TRUSTED_SUBNETS=()

# Optional corroboration for subnet matches.
TRUSTED_GATEWAYS=()
TRUSTED_DNS_SUFFIXES=()
TRUSTED_MARKER_HOSTS=()

TRUSTED_ACTION="down"
UNTRUSTED_ACTION="up"
