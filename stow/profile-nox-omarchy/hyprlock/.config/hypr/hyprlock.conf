# Lock screen / screensaver appearance for nox (personal T490).
# Overrides the Omarchy default lock styling for this machine.

background {
    monitor =
    color = rgba(26, 27, 38, 1.0)
    blur_passes = 2
    blur_size = 6
}

input-field {
    monitor =
    size = 280, 48
    outline_thickness = 2
    dots_size = 0.28
    dots_spacing = 0.3
    outer_color = rgba(80, 250, 123, 0.9)   # green accent (matches borders)
    inner_color = rgba(40, 42, 54, 0.9)
    font_color = rgba(248, 248, 242, 1.0)
    placeholder_text = <i>nox</i>
    fade_on_empty = false
    position = 0, -40
    halign = center
    valign = center
}

label {
    monitor =
    text = $TIME
    font_size = 48
    font_family = JetBrainsMono Nerd Font
    color = rgba(248, 248, 242, 1.0)
    position = 0, 120
    halign = center
    valign = center
}
