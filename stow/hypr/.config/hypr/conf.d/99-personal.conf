# Personal Hyprland overrides tracked by dotfiles.
# Keep machine-local secrets or host-specific values out of this file.

general {
    gaps_in = 3
    gaps_out = 6
    border_size = 2
    col.active_border = rgba(50fa7bff)
    col.inactive_border = rgba(44475aaa)
}

decoration {
    rounding = 8
    dim_inactive = true
    dim_strength = 0.08

    shadow {
        enabled = true
        range = 6
        render_power = 3
        color = rgba(1a1a1acc)
    }

    blur {
        enabled = true
        size = 3
        passes = 2
        brightness = 0.65
        contrast = 0.80
        noise = 0.02
    }
}

animations {
    bezier = expo,     0.16, 1,    0.3,  1
    bezier = smoothOut,0.36, 0,    0.66, -0.56
    bezier = snap,     0.1,  1,    0.1,  1

    animation = windows,           1, 3.5, expo,      popin 80%
    animation = windowsIn,         1, 3.5, expo,      popin 80%
    animation = windowsOut,        1, 2,   smoothOut, popin 80%
    animation = border,            1, 6,   expo
    animation = fade,              1, 3,   expo
    animation = fadeIn,            1, 2.5, expo
    animation = fadeOut,           1, 1.8, smoothOut
    animation = layers,            1, 3,   expo
    animation = layersIn,          1, 3.5, expo,      fade
    animation = layersOut,         1, 2,   smoothOut, fade
    animation = fadeLayersIn,      1, 2,   expo
    animation = fadeLayersOut,     1, 1.5, smoothOut
    animation = workspaces,        1, 4,   expo,      slide
    animation = specialWorkspace,  1, 4,   expo,      slidevert
}
