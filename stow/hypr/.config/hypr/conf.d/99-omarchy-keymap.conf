# Shared Omarchy keymap overrides.
# Sourced via: source = ~/.config/hypr/conf.d/*.conf

# Default terminal.
env = TERMINAL,wezterm

# Quick notes and quake terminal.
exec-once = omarchy-quick-surfaces-daemon
unbind = SUPER, RETURN
unbind = ALT, RETURN
unbind = ALT SHIFT, RETURN
unbind = SUPER, Q
unbind = SUPER SHIFT, code:13
unbind = SUPER SHIFT, N
bindd = SUPER, RETURN, Terminal, exec, uwsm-app -- xdg-terminal-exec --dir="$(omarchy-cmd-terminal-cwd)"
bindd = ALT, RETURN, Terminal, exec, uwsm-app -- xdg-terminal-exec --dir="$(omarchy-cmd-terminal-cwd)"
bindd = ALT SHIFT, RETURN, Alacritty, exec, uwsm-app -- alacritty --working-directory "$(omarchy-cmd-terminal-cwd)"
bindd = SUPER, Q, Close window, killactive
bindd = SUPER SHIFT, code:13, Region screenshot, exec, omarchy-capture-screenshot region
bindd = CTRL, code:49, Quake terminal, exec, omarchy-quake toggle
bindd = CTRL SHIFT, code:49, Quick notes, exec, omarchy-notes toggle
bindd = SUPER SHIFT, N, Quick capture, exec, omarchy-notes-capture

# Aerospace-style workspace navigation.
bindd = CTRL, code:10, Workspace 1, workspace, 1
bindd = CTRL, code:11, Workspace 2, workspace, 2
bindd = CTRL, code:12, Workspace 3, workspace, 3
bindd = CTRL, code:13, Workspace 4, workspace, 4
bindd = CTRL, code:14, Workspace 5, workspace, 5
bindd = CTRL, code:15, Workspace 6, workspace, 6
bindd = CTRL, code:16, Workspace 7, workspace, 7
bindd = CTRL, code:17, Workspace 8, workspace, 8
bindd = CTRL, code:18, Workspace 9, workspace, 9
bindd = CTRL SHIFT, code:10, Move window to workspace 1, exec, sh -lc 'hyprctl dispatch movetoworkspace 1 && hyprctl dispatch workspace 1'
bindd = CTRL SHIFT, code:11, Move window to workspace 2, exec, sh -lc 'hyprctl dispatch movetoworkspace 2 && hyprctl dispatch workspace 2'
bindd = CTRL SHIFT, code:12, Move window to workspace 3, exec, sh -lc 'hyprctl dispatch movetoworkspace 3 && hyprctl dispatch workspace 3'
bindd = CTRL SHIFT, code:13, Move window to workspace 4, exec, sh -lc 'hyprctl dispatch movetoworkspace 4 && hyprctl dispatch workspace 4'
bindd = CTRL SHIFT, code:14, Move window to workspace 5, exec, sh -lc 'hyprctl dispatch movetoworkspace 5 && hyprctl dispatch workspace 5'
bindd = CTRL SHIFT, code:15, Move window to workspace 6, exec, sh -lc 'hyprctl dispatch movetoworkspace 6 && hyprctl dispatch workspace 6'
bindd = CTRL SHIFT, code:16, Move window to workspace 7, exec, sh -lc 'hyprctl dispatch movetoworkspace 7 && hyprctl dispatch workspace 7'
bindd = CTRL SHIFT, code:17, Move window to workspace 8, exec, sh -lc 'hyprctl dispatch movetoworkspace 8 && hyprctl dispatch workspace 8'
bindd = CTRL SHIFT, code:18, Move window to workspace 9, exec, sh -lc 'hyprctl dispatch movetoworkspace 9 && hyprctl dispatch workspace 9'

# Aerospace-style app launchers.
bindd = ALT, B, Vivaldi, exec, uwsm-app -- vivaldi
bindd = ALT SHIFT, B, Firefox, exec, uwsm-app -- firefox
bindd = ALT, G, ChatGPT, exec, sh -lc 'uwsm-app -- chatgpt || uwsm-app -- gtk-launch chatgpt.desktop || uwsm-app -- gtk-launch com.openai.chatgpt.desktop'
bindd = ALT, E, Thunderbird, exec, uwsm-app -- thunderbird

# Keep the desktop-native terminal surfaces clean and reusable.
windowrule = float on, match:class ^(omarchy-quick-notes|omarchy-quake-terminal)$
windowrule = border_size 0, match:class ^(omarchy-quick-notes|omarchy-quake-terminal)$
windowrule = opacity 0.96 0.92, match:class ^omarchy-quick-notes$
windowrule = opacity 0.97 0.94, match:class ^omarchy-quake-terminal$
