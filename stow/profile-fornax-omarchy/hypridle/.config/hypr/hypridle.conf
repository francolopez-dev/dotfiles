# Idle / screensaver / sleep policy for fornax (work Lenovo).
# This is the machine's idle policy and overrides the Omarchy default.
# Work machine: tighter timeouts for security (lock fast when away).
#
# Apply with `dotfiles apply`; (re)start with `systemctl --user restart hypridle`
# or it is launched by Omarchy's autostart.

general {
    lock_cmd = pidof hyprlock || hyprlock
    before_sleep_cmd = loginctl lock-session
    after_sleep_cmd = hyprctl dispatch dpms on
}

# 1.5 min: dim.
listener {
    timeout = 90
    on-timeout = brightnessctl -s set 10
    on-resume = brightnessctl -r
}

# 3 min: lock.
listener {
    timeout = 180
    on-timeout = loginctl lock-session
}

# 3.5 min: displays off.
listener {
    timeout = 210
    on-timeout = hyprctl dispatch dpms off
    on-resume = hyprctl dispatch dpms on
}

# 15 min: suspend.
listener {
    timeout = 900
    on-timeout = systemctl suspend
}
