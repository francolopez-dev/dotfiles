# macOS-like Omarchy keybindings.
# Keep this focused on global Hyprland behavior; app text zoom is app-specific.

# Replace Omarchy's direct SUPER + arrow focus movement with Vim-style focus.
unbind = SUPER, LEFT
unbind = SUPER, RIGHT
unbind = SUPER, UP
unbind = SUPER, DOWN
bindd = CTRL, H, Focus window left, movefocus, l
bindd = CTRL, J, Focus window down, movefocus, d
bindd = CTRL, K, Focus window up, movefocus, u
bindd = CTRL, L, Focus window right, movefocus, r

# Move Omarchy's plus/minus resize behavior from SUPER to CTRL.
# code:20 is minus; code:21 is equal/plus on common Linux layouts.
unbind = SUPER, code:20
unbind = SUPER, code:21
unbind = SUPER SHIFT, code:20
unbind = SUPER SHIFT, code:21
bindd = CTRL, code:21, Horizontal resize active window, resizeactive, 100 0
bindd = CTRL SHIFT, code:21, Horizontal resize active window, resizeactive, 100 0
bindd = CTRL, code:20, Horizontal resize active window opposite, resizeactive, -100 0
