# Monitor layout for nox (personal Lenovo T490).
# This file lives in the PROFILE layer, never in os-omarchy — monitor scale is
# machine-specific and putting it in the OS layer was the long-standing
# "scale not applying" bug.
#
# Format: monitor = <name>, <resolution>, <position>, <scale>
# Inspect live outputs with: hyprctl monitors

monitor = eDP-1, preferred, auto, 1

# Example external/docked layout (uncomment and adjust when docked):
# monitor = DP-1, preferred, auto, 1
# monitor = eDP-1, preferred, 0x0, 1
