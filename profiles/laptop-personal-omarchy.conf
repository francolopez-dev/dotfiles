# Omarchy personal laptop — desktop + personal extras
# Shared dotfiles: profiles/stow-base. Omarchy shortcuts: profiles/stow-os-base.
PACKAGE_GROUPS=(common desktop personal)
STOW_PACKAGES=(nvim btop wezterm ghostty alacritty recovery-pack)
SERVICES=(tailscale)
SYNC=(tailscale atuin)

# Profile display metadata. Runtime helpers still use live Hyprland monitor data,
# but these values describe expected/default layouts and quick-surface tuning.
DISPLAY_CLASS="laptop"
DISPLAY_DEFAULT_RESOLUTION="1920x1080"
DISPLAY_DEFAULT_SCALE="1"
DISPLAY_LAYOUT_HINT="mobile-docked"
QUICK_SURFACE_MONITOR_MODE="focused"
QUICK_SURFACE_NOTES_WIDTH_PERCENT="28"
QUICK_SURFACE_QUAKE_HEIGHT_PERCENT="48"
QUICK_SURFACE_TOP_OFFSET="28"
QUICK_SURFACE_BOTTOM_OFFSET="28"
DISPLAY_MODES=(
  "internal:1920x1080@60:scale=1"
  "docked-single:external-preferred"
  "docked-multi:focused-monitor"
)
HARDWARE_PACKAGE_GROUPS=(laptop)
