# Idle / screensaver / sleep policy for fornax (work Lenovo / OLED).
# This is the machine's idle policy and overrides the Omarchy default.
# Toggle OLED protection with `dotfiles oled on|off|status`.
#
# Apply with `dotfiles apply`; (re)start with `systemctl --user restart hypridle`
# or it is launched by Omarchy's autostart.

general {
    lock_cmd = omarchy-system-lock
    before_sleep_cmd = OMARCHY_LOCK_ONLY=true omarchy-system-lock
    after_sleep_cmd = sleep 1 && omarchy-system-wake
    inhibit_sleep = 3
}

# Default mode: 3 min dim.
listener {
    timeout = 180
    on-timeout = dotfiles oled _timeout default dim
    on-resume = dotfiles oled _resume default dim
}

# Default mode: 10 min lock.
listener {
    timeout = 600
    on-timeout = dotfiles oled _timeout default lock
}

# Default mode: 15 min displays off.
listener {
    timeout = 900
    on-timeout = dotfiles oled _timeout default display-off
    on-resume = dotfiles oled _resume default display-off
}

# Default mode: 60 min suspend.
listener {
    timeout = 3600
    on-timeout = dotfiles oled _timeout default suspend
}

# OLED mode: 10 min dim.
listener {
    timeout = 600
    on-timeout = dotfiles oled _timeout oled dim
    on-resume = dotfiles oled _resume oled dim
}

# OLED mode: 35 min screensaver.
listener {
    timeout = 2100
    on-timeout = dotfiles oled _timeout oled screensaver
}

# OLED mode: 1 hr lock.
listener {
    timeout = 3600
    on-timeout = dotfiles oled _timeout oled lock
}

# OLED mode: 120 min displays off.
listener {
    timeout = 7200
    on-timeout = dotfiles oled _timeout oled display-off
    on-resume = dotfiles oled _resume oled display-off
}

# OLED mode: 5 hr suspend.
listener {
    timeout = 18000
    on-timeout = dotfiles oled _timeout oled suspend
}
