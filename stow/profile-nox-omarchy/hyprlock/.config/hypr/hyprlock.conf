# Lock screen / login-style password prompt for nox (personal T490).
# This is the visible Omarchy password screen after SDDM autologin starts the
# Hyprland session. SDDM remains the display manager; this only styles hyprlock.

general {
    ignore_empty_input = true
}

background {
    monitor =
    color = rgba(16, 17, 20, 1.0)
    blur_passes = 3
    blur_size = 6
}

animations {
    enabled = false
}

input-field {
    monitor =

    # Password field shown below the user label.
    # Keep this minimal so it still feels like the Omarchy lock screen.
    size = 340, 54
    outline_thickness = 1
    dots_size = 0.24
    dots_spacing = 0.28
    outer_color = rgba(70, 74, 88, 1.0)
    inner_color = rgba(31, 33, 40, 0.92)
    font_color = rgba(245, 245, 247, 1.0)
    placeholder_text = Password
    fail_text = <i>Password incorrect. Try again.</i>
    fade_on_empty = false
    rounding = 14
    shadow_passes = 0
    position = 0, -116
    halign = center
    valign = center
}

label {
    monitor =

    # Login clock format.
    # Example: 8:54 PM
    text = cmd[update:1000] date +"%-I:%M %p"
    font_size = 76
    font_family = Sans Serif
    color = rgba(245, 245, 247, 1.0)
    position = 0, 128
    halign = center
    valign = center
}

label {
    monitor =

    # Login date format.
    # Example: Tuesday, June 24
    text = cmd[update:60000] date +"%A, %B %-d"
    font_size = 22
    font_family = Sans Serif
    color = rgba(199, 200, 204, 1.0)
    position = 0, 62
    halign = center
    valign = center
}

# Enable/disable hostname display.
# Uncomment this block to show a small hostname label.
# Example: nox
# label {
#     monitor =
#     text = nox
#     font_size = 14
#     font_family = Sans Serif
#     color = rgba(133, 136, 149, 1.0)
#     position = 0, 22
#     halign = center
#     valign = center
# }

label {
    monitor =

    # User label shown above password prompt.
    # Use a literal name for reliability before unlock; change to Franco if preferred.
    text = jfranco
    font_size = 28
    font_family = Sans Serif
    color = rgba(245, 245, 247, 1.0)
    position = 0, -52
    halign = center
    valign = center
}
