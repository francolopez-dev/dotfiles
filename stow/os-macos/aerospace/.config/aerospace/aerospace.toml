# App rules.
# To discover bundle IDs later:
# aerospace list-apps --format '%{app-bundle-id} | %{app-name} | %{app-bundle-path}'

# Communication and AI apps that should float.
[[on-window-detected]]
if.app-id = 'com.microsoft.teams'
run = 'layout floating'

[[on-window-detected]]
if.app-id = 'com.microsoft.teams2'
run = 'layout floating'

[[on-window-detected]]
if.app-id = 'com.apple.reminders'
run = 'layout floating'

[[on-window-detected]]
if.app-id = 'com.openai.codex' # ChatGPT.app
run = 'layout floating'

[[on-window-detected]]
if.app-id = 'com.openai.chat' # ChatGPT Classic.app
run = 'layout floating'

[[on-window-detected]]
if.app-id = 'com.openai.chatgpt' # Legacy ChatGPT bundle ID, kept harmless.
run = 'layout floating'

[[on-window-detected]]
if.app-id = 'com.anthropic.claudefordesktop'
run = 'layout floating'

# System utility windows that should float.
[[on-window-detected]]
if.app-id = 'com.apple.finder'
run = 'layout floating'

[[on-window-detected]]
if.app-id = 'com.apple.MobileSMS'
run = 'layout floating'

[[on-window-detected]]
if.app-id = 'com.google.Chrome'
run = 'layout floating'

# Workspace assignment rules.
[[on-window-detected]]
if.app-id = 'com.microsoft.Outlook'
run = 'move-node-to-workspace two'

[[on-window-detected]]
if.app-id = 'com.apple.Safari'
run = 'move-node-to-workspace five'

[[on-window-detected]]
if.app-id = 'org.mozilla.firefox'
run = 'move-node-to-workspace four'

[[on-window-detected]]
if.app-id = 'com.neovide.neovide'
run = 'move-node-to-workspace six'

# Utility and development apps that should float.
[[on-window-detected]]
if.app-id = 'com.mitchellh.ghostty'
run = 'layout floating'

[[on-window-detected]]
if.app-id = 'notion.id'
run = 'layout floating'

[[on-window-detected]]
if.app-id = 'com.panic.Transmit'
run = 'layout floating'

[[on-window-detected]]
if.app-id = 'com.github.GitHubClient'
run = 'layout floating'

[[on-window-detected]]
if.app-id = 'com.docker.docker'
run = 'layout floating'

[[on-window-detected]]
if.app-id = 'de.feschber.LanMouse'
run = 'layout floating'

[[on-window-detected]]
if.app-id = 'com.lujjjh.LinearMouse'
run = 'layout floating'

