# Phase 2B-2: Restic integration. Optional secondary backup path.
# Set RECOVERY_PACK_RESTIC_ENABLED=1 to include encrypted artifacts in a Restic
# backup after generation. The repository and password must be configured via
# standard Restic environment variables (RESTIC_REPOSITORY, RESTIC_PASSWORD_FILE,
# etc.) or overridden here.
RECOVERY_PACK_RESTIC_ENABLED=0

# Override Restic repository. Leave empty to use RESTIC_REPOSITORY from environment.
RECOVERY_PACK_RESTIC_REPOSITORY=""

# Override Restic password file. Leave empty to use RESTIC_PASSWORD_FILE from environment.
RECOVERY_PACK_RESTIC_PASSWORD_FILE=""

# Tag applied to Restic snapshots created by the recovery pack generator.
RECOVERY_PACK_RESTIC_TAG="recovery-pack"

# Phase 2B-3: Email reporting. Optional status report after generation.
# Set RECOVERY_PACK_EMAIL_ENABLED=1 and configure RECOVERY_PACK_EMAIL_TO.
# Requires a working `mail` or `sendmail` command, or msmtp.
RECOVERY_PACK_EMAIL_ENABLED=0

# Recipient address for recovery pack reports.
RECOVERY_PACK_EMAIL_TO=""

# Sender address. Leave empty for system default.
RECOVERY_PACK_EMAIL_FROM=""

# Attach the encrypted .age artifact to the email. Disabled by default.
# Enabling this makes email a backup target — intentional opt-in only.
RECOVERY_PACK_EMAIL_ATTACH=0

# Phase 2B-4: Optional Hetzner Storage Box. Disabled by default.
# Set RECOVERY_PACK_HETZNER_ENABLED=1 and configure the target.
# Uses scp/sftp. Failure does not break NAS/Restic success.
RECOVERY_PACK_HETZNER_ENABLED=0

# Hetzner Storage Box target in scp format: user@host:path
RECOVERY_PACK_HETZNER_TARGET=""

# SSH port for Hetzner Storage Box (default 23 for Hetzner).
RECOVERY_PACK_HETZNER_PORT=23
