# Shared Omarchy keymap overrides.
# Sourced via: source = ~/.config/hypr/conf.d/*.conf

# Default terminal.
env = TERMINAL,ghostty

# Quick notes and quake terminal.
exec-once = omarchy-quick-surfaces-daemon
unbind = SUPER, RETURN
unbind = SUPER, A
unbind = SUPER, C
unbind = SUPER, T
unbind = SUPER, V
unbind = ALT, RETURN
unbind = ALT SHIFT, RETURN
unbind = SUPER, Q
unbind = SUPER, W
unbind = SUPER, K
unbind = SUPER SHIFT, RETURN
unbind = SUPER SHIFT, code:13
unbind = SUPER SHIFT, N
unbind = SUPER, code:10
unbind = SUPER, code:11
unbind = SUPER, code:12
unbind = SUPER, code:13
unbind = SUPER, code:14
unbind = SUPER, code:15
unbind = SUPER, code:16
unbind = SUPER, code:17
unbind = SUPER, code:18
unbind = SUPER, code:19
unbind = SUPER SHIFT, code:10
unbind = SUPER SHIFT, code:11
unbind = SUPER SHIFT, code:12
unbind = SUPER SHIFT, code:13
unbind = SUPER SHIFT, code:14
unbind = SUPER SHIFT, code:15
unbind = SUPER SHIFT, code:16
unbind = SUPER SHIFT, code:17
unbind = SUPER SHIFT, code:18
unbind = SUPER SHIFT, code:19
unbind = SUPER SHIFT, LEFT
unbind = SUPER SHIFT, RIGHT
unbind = SUPER SHIFT, UP
unbind = SUPER SHIFT, DOWN
unbind = SUPER ALT SHIFT, code:10
unbind = SUPER ALT SHIFT, code:11
unbind = SUPER ALT SHIFT, code:12
unbind = SUPER ALT SHIFT, code:13
unbind = SUPER ALT SHIFT, code:14
unbind = SUPER ALT SHIFT, code:15
unbind = SUPER ALT SHIFT, code:16
unbind = SUPER ALT SHIFT, code:17
unbind = SUPER ALT SHIFT, code:18
unbind = SUPER ALT SHIFT, code:19
bindd = SUPER, RETURN, Terminal, exec, uwsm-app -- xdg-terminal-exec --dir="$(omarchy-cmd-terminal-cwd)"
bindd = SUPER, A, Select all, exec, omarchy-terminal-shortcut select-all
bindd = SUPER, C, Copy, exec, omarchy-terminal-shortcut copy
bindd = SUPER, V, Paste, exec, omarchy-terminal-shortcut paste
bindd = ALT, RETURN, Terminal, exec, uwsm-app -- xdg-terminal-exec --dir="$(omarchy-cmd-terminal-cwd)"
bindd = ALT SHIFT, RETURN, Ghostty, exec, uwsm-app -- ghostty --working-directory="$(omarchy-cmd-terminal-cwd)"
bindd = SUPER SHIFT, RETURN, Alacritty, exec, uwsm-app -- alacritty --working-directory "$(omarchy-cmd-terminal-cwd)"
bindd = SUPER, W, Close window/tab, exec, omarchy-close-window
bindd = SUPER, Q, Quit app, exec, omarchy-quit-app
bindd = SUPER, K, Dotfiles keybindings and commands, exec, dotfiles-discovery-menu
bindd = SUPER SHIFT, code:13, Region screenshot, exec, omarchy-capture-screenshot region
bindd = CTRL SHIFT, B, Toggle Waybar, exec, sh -lc 'omarchy toggle waybar || dotfiles desktop reload waybar'
bindd = CTRL, code:49, Quake terminal, exec, omarchy-quake toggle
bindd = CTRL SHIFT, code:49, Quick notes, exec, omarchy-notes toggle
bindd = CTRL ALT, code:49, Todo drawer, exec, omarchy-todo toggle
bindd = SUPER SHIFT, N, Quick capture, exec, omarchy-notes-capture
bindd = CTRL SHIFT, Z, Toggle floating, togglefloating

# Omarchy menu (official binding) and clipboard manager.
unbind = SUPER ALT, SPACE
bindd = SUPER ALT, SPACE, Omarchy menu, exec, omarchy-menu
bindd = SUPER SHIFT, V, Clipboard manager, exec, omarchy-launch-walker -m clipboard

# Neovim-style window movement.
bindd = CTRL SHIFT, H, Move window left, swapwindow, l
bindd = CTRL SHIFT, J, Move window down, swapwindow, d
bindd = CTRL SHIFT, K, Move window up, swapwindow, u
bindd = CTRL SHIFT, L, Move window right, swapwindow, r

# Aerospace-style workspace navigation.
bindd = CTRL, code:10, Workspace 1, workspace, 1
bindd = CTRL, code:11, Workspace 2, workspace, 2
bindd = CTRL, code:12, Workspace 3, workspace, 3
bindd = CTRL, code:13, Workspace 4, workspace, 4
bindd = CTRL, code:14, Workspace 5, workspace, 5
bindd = CTRL, code:15, Workspace 6, workspace, 6
bindd = CTRL, code:16, Workspace 7, workspace, 7
bindd = CTRL, code:17, Workspace 8, workspace, 8
bindd = CTRL, code:18, Workspace 9, workspace, 9
bindd = CTRL SHIFT, code:10, Move window to workspace 1, exec, sh -lc 'hyprctl dispatch movetoworkspace 1 && hyprctl dispatch workspace 1'
bindd = CTRL SHIFT, code:11, Move window to workspace 2, exec, sh -lc 'hyprctl dispatch movetoworkspace 2 && hyprctl dispatch workspace 2'
bindd = CTRL SHIFT, code:12, Move window to workspace 3, exec, sh -lc 'hyprctl dispatch movetoworkspace 3 && hyprctl dispatch workspace 3'
bindd = CTRL SHIFT, code:13, Move window to workspace 4, exec, sh -lc 'hyprctl dispatch movetoworkspace 4 && hyprctl dispatch workspace 4'
bindd = CTRL SHIFT, code:14, Move window to workspace 5, exec, sh -lc 'hyprctl dispatch movetoworkspace 5 && hyprctl dispatch workspace 5'
bindd = CTRL SHIFT, code:15, Move window to workspace 6, exec, sh -lc 'hyprctl dispatch movetoworkspace 6 && hyprctl dispatch workspace 6'
bindd = CTRL SHIFT, code:16, Move window to workspace 7, exec, sh -lc 'hyprctl dispatch movetoworkspace 7 && hyprctl dispatch workspace 7'
bindd = CTRL SHIFT, code:17, Move window to workspace 8, exec, sh -lc 'hyprctl dispatch movetoworkspace 8 && hyprctl dispatch workspace 8'
bindd = CTRL SHIFT, code:18, Move window to workspace 9, exec, sh -lc 'hyprctl dispatch movetoworkspace 9 && hyprctl dispatch workspace 9'

# Aerospace-style app launchers.
bindd = ALT, B, Vivaldi, exec, uwsm-app -- vivaldi
bindd = ALT SHIFT, B, Firefox, exec, uwsm-app -- firefox

# Keep the desktop-native terminal surfaces clean and reusable.
windowrule = float on, match:class ^(omarchy-quick-notes|omarchy-todo-drawer|omarchy-quake-terminal|gsimplecal)$
windowrule = border_size 0, match:class ^(omarchy-quick-notes|omarchy-todo-drawer|omarchy-quake-terminal|gsimplecal)$
windowrule = opacity 0.96 0.92, match:class ^omarchy-quick-notes$
windowrule = opacity 0.96 0.92, match:class ^omarchy-todo-drawer$
windowrule = opacity 0.97 0.94, match:class ^omarchy-quake-terminal$
windowrule = opacity 0.98 0.94, match:class ^gsimplecal$
windowrule = pin on, match:class ^gsimplecal$
