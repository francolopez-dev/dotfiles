# Lan Mouse peer config for fornax (Omarchy is the primary seat).
# The MacBook (lamac) sits to the RIGHT of this machine: move the cursor off
# the right edge to control it. Pairing workflow and troubleshooting:
# docs/kvm-sharing.md.

# Press these together to force input back to this machine.
release_bind = ["KeyLeftCtrl", "KeyLeftShift", "KeyLeftMeta", "KeyLeftAlt"]

port = 4242

# Peers allowed to send input TO this machine, keyed by TLS cert fingerprint.
# `dotfiles doctor` prints each machine's own fingerprint.
[authorized_fingerprints]
"bb:4e:be:51:4e:18:0b:b1:db:60:32:18:32:f4:44:b9:64:7f:0c:ee:10:c1:bd:2f:1f:65:88:b8:1d:72:68:86" = "lamac"

[[clients]]
# lan-mouse's resolver cannot do mDNS (.local) lookups, so `ips` is the
# mechanism that actually connects (it tries every entry). Append the peer's
# IP at each new site — or its Tailscale 100.x.y.z once, which works
# everywhere. The hostname is a label plus a plain-DNS attempt.
hostname = "lamac"
position = "right"
activate_on_startup = true
ips = ["192.168.145.167"]
port = 4242
