# Lan Mouse peer config for lamac (MacBook).
# The Omarchy machines are the primary seats and sit to the LEFT of this
# screen. Sharing is peer-to-peer: whichever machine's physical mouse crosses
# its screen edge captures the other, so this file also lets the mac drive an
# Omarchy machine when its fingerprint below is filled in. Workflow:
# docs/kvm-sharing.md.

# Press these together to force input back to this machine.
release_bind = ["KeyLeftCtrl", "KeyLeftShift", "KeyLeftMeta", "KeyLeftAlt"]

port = 4242

# Peers allowed to send input TO this machine, keyed by TLS cert fingerprint.
# After the first `dotfiles update` on an Omarchy machine, `dotfiles doctor`
# there prints its fingerprint; paste it here and commit:
#   "aa:bb:...:ff" = "fornax"
[authorized_fingerprints]

[[clients]]
# lan-mouse's resolver cannot do mDNS (.local) lookups, so `ips` is the
# mechanism that actually connects (it tries every entry). Append each peer's
# IP per site — or its Tailscale 100.x.y.z once, which works everywhere. The
# hostname is a label plus a plain-DNS attempt. Get an Omarchy machine's IP
# with: ip -4 -brief addr
hostname = "fornax"
position = "left"
activate_on_startup = true
ips = []
port = 4242

[[clients]]
hostname = "nox"
position = "left"
activate_on_startup = true
ips = []
port = 4242
