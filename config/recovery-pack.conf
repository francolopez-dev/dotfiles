# Recovery Pack configuration.
#
# This file is intentionally safe by default: it contains no active paths to
# personal secrets. Add explicit allow-list entries only after reviewing
# docs/recovery-pack-usage.md and docs/recovery-pack-spec.md.
#
# Entry format:
#   "/absolute/path|classification|reason"
#
# Bare paths are also supported:
#   "$HOME/.ssh/id_ed25519"
#
# Arrays without OPTIONAL_ are required. Missing required paths fail.
# Matching OPTIONAL_ arrays warn when missing.

# Phase 2B-1 NAS copy target. The generator uses this only when invoked with
# --copy-to-nas. It must already exist and be writable.
RECOVERY_PACK_NAS_PATH="/storage/backups/recovery-pack/"

AGE_RECIPIENTS=(
  # "age1..."
)

# Decrypting identities that live outside the Recovery Pack. Required for real
# build and verify operations. Dry-run mode permits this to be empty so the
# framework can be exercised before collecting real secrets.
AGE_BOOTSTRAP_IDENTITIES=(
  # "$HOME/.config/age/keys.txt"
)

AGE_IDENTITIES=(
  # "$HOME/.config/age/keys.txt|age-identity|Restore Age identities after bootstrap"
)

SSH_PATHS=(
  # "$HOME/.ssh/id_ed25519|ssh-private-key|Critical infrastructure SSH access"
)

WIREGUARD_PATHS=(
)

VPN_PATHS=(
)

CERTIFICATE_PATHS=(
)

INFRA_EXPORT_PATHS=(
  # "$HOME/recovery-exports/cloudflare-zones.json|cloudflare-export|Day-1 Cloudflare zone export"
  # "$HOME/recovery-exports/tailscale-acl.json|tailscale-acl|Tailscale ACL/config export without machine state"
  # "$HOME/recovery-exports/router-backup.conf|router-backup|Router backup"
  # "$HOME/recovery-exports/firewall-backup.conf|firewall-backup|Firewall backup"
  # "$HOME/recovery-exports/proxmox-cluster.conf|proxmox-config|Proxmox cluster config"
  # "$HOME/recovery-exports/vaultwarden-backup-metadata.json|vaultwarden-metadata|Vaultwarden backup metadata only"
  # "$HOME/recovery-exports/restic-repositories.txt|restic-repository-info|Restic repository location and verification info"
)

OPTIONAL_AGE_IDENTITIES=(
)

OPTIONAL_SSH_PATHS=(
