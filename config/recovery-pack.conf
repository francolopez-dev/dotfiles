# Recovery Pack configuration.
#
# This file is intentionally safe by default: it contains no active paths to
# personal secrets. Add explicit allow-list entries only after reviewing
# docs/recovery-pack-usage.md and docs/recovery-pack-spec.md.
#
# Entry format:
#   "/absolute/path|classification|reason"
#
# Bare paths are also supported:
#   "$HOME/.ssh/id_ed25519"
#
# Arrays without OPTIONAL_ are required. Missing required paths fail.
# Matching OPTIONAL_ arrays warn when missing.

AGE_RECIPIENTS=(
  # "age1..."
)

# Decrypting identities that live outside the Recovery Pack. Required for real
# build and verify operations. Dry-run mode permits this to be empty so the
# framework can be exercised before collecting real secrets.
