# Dotfiles-managed wallpaper rotation shared by Omarchy and macOS.
#
# This file is stowed to:
#   ~/.config/dotfiles/wallpapers.conf
#
# Commands:
#   dotfiles wallpaper status
#   dotfiles wallpaper rotate
#   dotfiles wallpaper open-local

# Enable automatic rotation where the OS scheduler is configured.
WALLPAPER_ROTATION_ENABLED=1

# Rotation interval. Supported suffixes: s, m, h, d.
WALLPAPER_ROTATION_INTERVAL="15m"

# Selection mode: random or sequential.
WALLPAPER_ROTATION_MODE="random"

# Repo-managed shared wallpapers. Rotation scans subfolders recursively.
WALLPAPER_REPO_DIR="$HOME/.local/share/wallpapers/shared"

# Machine-local personal wallpapers. The engine merges this folder only when it
# exists; `dotfiles wallpaper open-local` creates it on demand.
WALLPAPER_LOCAL_DIR="$HOME/Pictures/local-wallpapers"
