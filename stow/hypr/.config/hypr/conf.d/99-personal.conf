# Personal Hyprland overrides.
# Sourced via: source = ~/.config/hypr/conf.d/*.conf

# Default terminal.
env = TERMINAL,wezterm

# Quick notes and quake terminal.
exec-once = omarchy-quick-surfaces-daemon
unbind = SUPER, RETURN
unbind = SUPER SHIFT, N
bindd = SUPER, RETURN, Terminal, exec, uwsm-app -- xdg-terminal-exec --dir="$(omarchy-cmd-terminal-cwd)"
bindd = CTRL, code:49, Quake terminal, exec, omarchy-quake toggle
bindd = CTRL SHIFT, code:49, Quick notes, exec, omarchy-notes toggle
bindd = SUPER SHIFT, N, Quick capture, exec, omarchy-notes-capture

# Keep the desktop-native terminal surfaces clean and reusable.
windowrule = float on, match:class ^(omarchy-quick-notes|omarchy-quake-terminal)$
windowrule = border_size 0, match:class ^(omarchy-quick-notes|omarchy-quake-terminal)$
windowrule = opacity 0.96 0.92, match:class ^omarchy-quick-notes$
windowrule = opacity 0.97 0.94, match:class ^omarchy-quake-terminal$
