# Monitor layout for fornax (work Lenovo).
# This file lives in the PROFILE layer, never in os-omarchy - monitor scale is
# machine-specific and putting it in the OS layer was the long-standing
# "scale not applying" bug.
#
# Format: monitor = <name>, <resolution>, <position>, <scale>
# Inspect live outputs with: hyprctl monitors
#
# NOTE: defaulting to preferred resolution @ scale 1 - confirm fornax's actual panel
# resolution/scale and adjust if it differs.
#
# Common names:
# - Laptop panel is usually eDP-1.
# - USB-C/DisplayPort outputs are usually DP-1, DP-2, etc.
# - HDMI outputs are usually HDMI-A-1, HDMI-A-2, etc.
#
# Position format is <x>x<y>. Think of the top-left corner of the whole layout
# as 0x0. A 1920-wide laptop with a monitor to the right usually puts the
# external at 1920x0. A monitor to the left can use a negative x position.
#
# Scale examples:
# - 1    = normal size, common for 1080p.
# - 1.25 = slightly larger UI.
# - 1.5  = larger UI, common for high-DPI panels.
# - 0.85 = smaller UI, fits more content.

monitor = eDP-1, preferred, auto, 0.85

# Laptop only, explicit:
# monitor = eDP-1, preferred, 0x0, 1

# External monitor to the RIGHT of the laptop:
# monitor = eDP-1, preferred, 0x0, 0.85
# monitor = DP-1, preferred, 1920x0, 1

# External monitor to the LEFT of the laptop:
# monitor = DP-1, preferred, 0x0, 1
# monitor = eDP-1, preferred, 2560x0, 0.85

# External monitor ABOVE the laptop:
# monitor = DP-1, preferred, 0x0, 1
# monitor = eDP-1, preferred, 0x1440, 0.85

# External monitor BELOW the laptop:
# monitor = eDP-1, preferred, 0x0, 0.85
# monitor = DP-1, preferred, 0x1080, 1

# Docked: external as main display, laptop to the right with smaller UI:
# monitor = DP-1, 2560x1440@60, 0x0, 1
# monitor = eDP-1, preferred, 2560x0, 0.85

# Mirror laptop and external display:
# monitor = eDP-1, preferred, 0x0, 0.85
# monitor = DP-1, preferred, 0x0, 1, mirror, eDP-1

# Docked with laptop screen disabled:
# monitor = eDP-1, disable
# monitor = DP-1, preferred, 0x0, 1
