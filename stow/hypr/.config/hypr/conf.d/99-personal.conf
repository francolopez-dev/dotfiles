# Personal Hyprland overrides.
# Sourced via: source = ~/.config/hypr/conf.d/*.conf
# Add this line to ~/.config/hypr/hyprland.conf if Omarchy doesn't source conf.d:
#   source = ~/.config/hypr/conf.d/*.conf

# Monitor configuration (adjust per machine).
# monitor = ,preferred,auto,1

# Default terminal.
env = TERMINAL,wezterm

# Custom keybinds.
bind = $mainMod, T, exec, wezterm

# Window rules.
windowrulev2 = opacity 0.95 0.90, class:^(wezterm)$

# Workspace rules.
# workspace = 1, monitor:DP-1, default:true
