# tmux is shared across macOS and Omarchy/Linux through the global stow layer.
# Keep this file focused on terminal-multiplexer behavior only: Ghostty,
# Hyprland, AeroSpace, and OS-level Cmd/Super/Ctrl+Shift copy-paste shortcuts
# are intentionally not managed here.

# -----------------------------------------------------------------------------
# Prefix keys
#
# Owner: tmux
# Keys: Ctrl+B and Ctrl+Space
# Action: start a tmux command/keybinding sequence.
# Reason: Ctrl+B is tmux's default and remains available for compatibility;
# Ctrl+Space is the preferred daily prefix because it is easier to type often.
# Scope: macOS and Linux/Omarchy.
# Conflict: Ctrl+Space can be used by IMEs or app shortcuts before tmux sees it;
# if that happens on a machine, Ctrl+B is the fallback.
# Fallback: use Ctrl+B followed by the same tmux command key.
# -----------------------------------------------------------------------------
set -g prefix C-b
set -g prefix2 C-Space

# -----------------------------------------------------------------------------
# Mouse selection and clipboard integration
#
# Owner: tmux
# Normal drag: pane-aware tmux mouse selection/copy behavior.
# Shift+drag: bypass tmux mouse reporting so Ghostty performs native terminal
# selection; then use the existing OS/Ghostty copy shortcut if desired.
# Clipboard path for tmux copies: tmux buffer -> OSC 52 -> Ghostty -> OS
# clipboard. This does not require pbcopy, wl-copy, xclip, or xsel.
#
# `set-clipboard external` lets tmux send copied text outward while preventing
# arbitrary applications running inside tmux from creating tmux paste buffers via
# OSC 52. `on` is more permissive and is intentionally not used here.
# -----------------------------------------------------------------------------
set -g mouse on
set -s set-clipboard external

# Keep enough scrollback for project sessions and copy mode without pushing all
# history management into Ghostty's terminal scrollback.
set -g history-limit 50000

# Use tmux's conservative default-compatible terminal inside panes. Ghostty's
# outer TERM is xterm-ghostty; tmux handles clipboard via set-clipboard/OSC 52.
set -g default-terminal "screen-256color"

# Faster escape for Vim/Neovim while keeping a nonzero delay for terminal escape
# sequences. Too low can break Alt/meta keys in some terminal applications.
set -sg escape-time 10

# Repeatable prefix bindings stay active briefly after the first keypress. This
# makes resize feel like a modal OS tiling resize: press Prefix H once, then keep
# tapping H/J/K/L without repeating the prefix for every step.
set -g repeat-time 700

# Use vi-style copy mode so movement and copy habits match Vim/Neovim: g/G for
# top/bottom, v/V for selection, and y for yank/copy.
setw -g mode-keys vi

# -----------------------------------------------------------------------------
# Copy mode and paste buffer workflow
#
# Owner: tmux
# Keys: Ctrl+Space Space, then v/V, c/y; Ctrl+Space v to paste.
# Action: enter pane-specific scrollback, select text, copy it to the tmux buffer
# and OS clipboard through OSC 52, then optionally paste the tmux buffer.
# Reason: Cmd/Super+C belongs to Ghostty or the OS before tmux receives input;
# these bindings keep the workflow tmux-only and reliable on macOS and Linux.
# Scope: macOS and Linux/Omarchy.
# Conflict: only active after the tmux prefix or inside tmux copy mode, so plain
# Ctrl+C still interrupts processes and terminal apps keep their shortcuts.
# Fallback: Ctrl+B works anywhere Ctrl+Space is intercepted; Shift+drag bypasses
# tmux for Ghostty-native selection.
# -----------------------------------------------------------------------------
bind Space copy-mode
bind v paste-buffer
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi V send-keys -X select-line
bind-key -T copy-mode-vi y send-keys -X copy-selection-and-cancel
bind-key -T copy-mode-vi c send-keys -X copy-selection-and-cancel

# -----------------------------------------------------------------------------
# Pane management
#
# Owner: tmux
# Keys: Prefix | and Prefix - split panes; Prefix h/j/k/l move focus;
# Prefix H/J/K/L resize panes.
# Action: create and navigate tmux panes without involving the OS window manager.
# Reason: these are simpler than tmux defaults (% and ") and match Vim-style
# direction keys used elsewhere in this repo. Uppercase resize bindings are
# repeatable: press Prefix H once, then continue with H/J/K/L while the repeat
# window is active.
# Scope: macOS and Linux/Omarchy.
# Conflict: only active after the tmux prefix, so shell/editor shortcuts are not
# shadowed.
# Fallback: tmux defaults remain available for other pane/window operations.
# -----------------------------------------------------------------------------
bind | split-window -h
bind - split-window -v
unbind '"'
unbind %

bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# Owner: tmux
# Keys: Prefix r
# Action: source ~/.tmux.conf and show a confirmation message.
# Reason: fast iteration after editing this stow-managed config.
# Scope: macOS and Linux/Omarchy.
# Conflict: only active after the tmux prefix.
# Fallback: run `tmux source-file ~/.tmux.conf` from a shell.
bind r source-file ~/.tmux.conf \; display-message "tmux reloaded"
